# Setiap push ke cabang main → otomatis deploy ke Cloudflare Pages (proyek aplikasigurukelasrtputra).
# Butuh 2 secret di GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token dengan izin "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — ID akun Cloudflare
name: Deploy ke Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aplikasigurukelasrtputra --branch=main --commit-dirty=true
