<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Ruang Santri · PKBM Al-Umm Barabai</title>
<meta name="theme-color" content="#0b4a3c"/>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2"></script>
<script src="src/config.js?v=4"></script>
<style>
  :root{--hijau:#0b4a3c;--hijau2:#13715b;--emas:#c9a227;--latar:#f3f6f4;--kartu:#fff;--teks:#1d2a26;--abu:#6b7c76;--garis:#dfe7e3;--merah:#c0392b;--biru:#1f5fbf;--pilih:#e3f3ec}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--latar);color:var(--teks);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;cursor:pointer}
  .atas{background:linear-gradient(135deg,var(--hijau),var(--hijau2));color:#fff;padding:18px 16px 46px;text-align:center}
  .atas h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.2px}
  .atas p{margin:4px 0 0;font-size:13px;opacity:.85}
  .wadah{max-width:720px;margin:-30px auto 40px;padding:0 14px}
  .kartu{background:var(--kartu);border-radius:16px;box-shadow:0 6px 24px rgba(11,74,60,.10);padding:18px;margin-bottom:14px}
  .judul-langkah{font-size:12px;font-weight:700;color:var(--hijau2);text-transform:uppercase;letter-spacing:.8px;margin:0 0 4px}
  h2{font-size:18px;margin:0 0 12px}
  .daftar{display:grid;gap:10px}
  .pilihan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--garis);border-radius:12px;padding:13px 14px;transition:.15s}
  .pilihan:hover{border-color:var(--hijau2);background:#f7fbf9}
  .pilihan .ikon{font-size:22px;width:34px;text-align:center;flex:none}
  .pilihan .isi{flex:1;min-width:0}
  .pilihan b{display:block;font-size:15px}
  .pilihan small{color:var(--abu);font-size:12.5px}
  .lencana{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .l-ujian{background:#fdecea;color:var(--merah)} .l-latihan{background:#e6f0fd;color:var(--biru)} .l-selesai{background:#e3f3ec;color:var(--hijau2)} .l-proses{background:#fff4d6;color:#8a6500}
  .cari{width:100%;padding:12px 14px;border:1.5px solid var(--garis);border-radius:12px;font:inherit;margin-bottom:10px}
  .tombol{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--hijau);color:#fff}
  .tombol.garis{background:#fff;color:var(--hijau);border:1.5px solid var(--hijau)}
  .tombol.lebar{width:100%}
  .tombol:disabled{opacity:.5;cursor:not-allowed}
  .kembali{background:none;border:0;color:var(--hijau2);font-weight:700;padding:0;margin-bottom:10px}
  .kosong{text-align:center;color:var(--abu);padding:26px 8px;font-size:14px}
  .kosong .besar{font-size:40px;margin-bottom:6px}
  .memuat{text-align:center;padding:30px;color:var(--abu)}
  .bilah{position:sticky;top:0;z-index:5;background:var(--hijau);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .bilah .nm{flex:1;min-width:0;font-size:13px;line-height:1.25}
  .bilah .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .waktu{font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:10px;font-size:15px}
  .waktu.kritis{background:var(--merah)}
  .simpan-info{font-size:11px;opacity:.8}
  .stimulus{background:#f7f4e8;border-left:4px solid var(--emas);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.65;margin-bottom:14px;white-space:pre-wrap}
  .stimulus .jdl{font-weight:800;text-align:center;margin-bottom:6px}
  .no-soal{font-size:12px;font-weight:700;color:var(--abu);margin-bottom:6px}
  .teks-soal{font-size:16px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap}
  .opsi{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--garis);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:15px;line-height:1.5}
  .opsi .huruf{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--garis);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--abu)}
  .opsi.dipilih{border-color:var(--hijau2);background:var(--pilih)}
  .opsi.dipilih .huruf{background:var(--hijau2);border-color:var(--hijau2);color:#fff}
  .pgk .opsi .huruf{border-radius:7px}
  textarea{width:100%;min-height:150px;border:1.5px solid var(--garis);border-radius:12px;padding:12px;font:inherit;font-size:15px;line-height:1.55;resize:vertical}
  .petunjuk{font-size:12.5px;color:var(--abu);margin:-6px 0 10px}
  .navi{display:flex;gap:10px;margin-top:6px}
  .navi .tombol{flex:1}
  .grid-no{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
  .grid-no button{height:40px;border-radius:10px;border:1.5px solid var(--garis);background:#fff;font-weight:700;font-size:13px}
  .grid-no button.terjawab{background:var(--pilih);border-color:var(--hijau2);color:var(--hijau)}
  .grid-no button.aktif{outline:3px solid var(--emas);outline-offset:1px}
  .grup-label{font-size:12px;font-weight:700;color:var(--abu);margin:12px 0 6px}
  .hasil{text-align:center;padding:26px 16px}
  .hasil .angka{font-size:72px;font-weight:800;color:var(--hijau);line-height:1;margin:8px 0}
  .hasil .ket{color:var(--abu);font-size:14px;line-height:1.6}
  .lapis{position:fixed;inset:0;background:rgba(10,30,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .lapis.buka{display:flex}
  .dialog{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:20px}
  .dialog h3{margin:0 0 8px}
  .dialog p{margin:0 0 16px;color:#44514c;line-height:1.55;font-size:14.5px}
  .dialog .navi{margin:0}
  input.token{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;text-transform:uppercase;border:1.5px solid var(--garis);border-radius:12px;font-weight:800;margin-bottom:14px}
  .galat{color:var(--merah);font-size:13px;margin-top:-6px;margin-bottom:10px;min-height:1em}
  .catatan-kaki{text-align:center;font-size:12px;color:var(--abu);margin-top:10px}
  @media (max-width:420px){.teks-soal{font-size:15.5px}.hasil .angka{font-size:60px}}
</style>
</head>
<body>
<div id="akar"></div>
<div class="lapis" id="lapis"><div class="dialog" id="dialog"></div></div>

<script>
// =====================================================================
//  RUANG SANTRI — latihan & ujian per bab (tanpa login; santri pilih namanya)
//  Kunci jawaban tidak pernah dikirim ke halaman ini: penilaian dilakukan
//  di server (RPC ujian_kirim), santri hanya menerima nilai akhir.
// =====================================================================
const supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const HURUF = "abcdefghij";
const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g,"<b><u>$1</u></b>"); // **kata** = dicetak tebal di soal asli
const S = { sesiList: [], kelasId: null, sesi: null, siswa: [], status: {}, murid: null, token: "", soal: [], idx: 0, jawab: { pg: {}, pgk: {}, uraian: {} }, sisa: null, timer: null, simpanT: null, pindahTab: 0, terkirim: false };

function pesanGalat(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Internet terputus. Periksa koneksi lalu coba lagi.";
  if (/function .* does not exist|ujian_/i.test(m) && /does not exist|schema cache/i.test(m)) return "Fitur ujian belum diaktifkan oleh admin (SQL belum dijalankan).";
  return m;
}
function render(html) { $("akar").innerHTML = html; window.scrollTo(0, 0); }
function kepala(sub) { return `<div class="atas"><h1>📝 Ruang Santri</h1><p>${esc(sub || "PKBM Al-Umm Barabai · Latihan & Ujian")}</p></div>`; }
function dialog(html) { $("dialog").innerHTML = html; $("lapis").classList.add("buka"); }
function tutupDialog() { $("lapis").classList.remove("buka"); }
function rpc(nama, arg) { return supa.rpc(nama, arg).then(({ data, error }) => { if (error) throw error; return data; }); }

// ── Langkah 1: pilih kelas ──
async function mulai() {
  render(kepala() + `<div class="wadah"><div class="kartu"><div class="memuat">Memuat ujian & latihan yang dibuka…</div></div></div>`);
  try {
    const { data, error } = await supa.from("ujian_sesi")
      .select("id,mode,durasi_menit,acak,kelas_id,bank_id,created_at,kelas:kelas(nama_kelas),bank:ujian_bank(judul,bab,tingkat,mapel:mapel(nama_mapel))")
      .eq("dibuka", true).order("created_at", { ascending: false });
    if (error) throw error;
    S.sesiList = data || [];
  } catch (e) {
    render(kepala() + `<div class="wadah"><div class="kartu kosong"><div class="besar">⚠️</div>${esc(pesanGalat(e))}<br><br><button class="tombol" onclick="mulai()">Coba lagi</button></div></div>`);
    return;
  }
  const kelas = {};
  S.sesiList.forEach((s) => { (kelas[s.kelas_id] = kelas[s.kelas_id] || { nama: s.kelas?.nama_kelas || "Kelas", n: 0 }).n++; });
  const ids = Object.keys(kelas).sort((a, b) => kelas[a].nama.localeCompare(kelas[b].nama, "id", { numeric: true }));
  if (ids.length === 1) { pilihKelas(ids[0]); return; }
  render(kepala() + `<div class="wadah"><div class="kartu">
    <p class="judul-langkah">Langkah 1</p><h2>Kamu kelas berapa?</h2>
    ${ids.length ? `<div class="daftar">${ids.map((id) => `<button class="pilihan" onclick="pilihKelas('${id}')"><span class="ikon">🏫</span><span class="isi"><b>${esc(kelas[id].nama)}</b><small>${kelas[id].n} latihan/ujian dibuka</small></span><span>›</span></button>`).join("")}</div>`
      : `<div class="kosong"><div class="besar">📭</div>Belum ada latihan atau ujian yang dibuka guru.<br>Tunggu arahan ustadz, lalu muat ulang.<br><br><button class="tombol garis" onclick="mulai()">↻ Muat ulang</button></div>`}
  </div><p class="catatan-kaki">Nilai akhir yang tampil adalah nilai resmi dari guru.</p></div>`);
}

// ── Langkah 2: pilih ujian/latihan ──
function pilihKelas(kelasId) {
  S.kelasId = kelasId;
  const list = S.sesiList.filter((s) => s.kelas_id === kelasId);
  const namaKelas = list[0]?.kelas?.nama_kelas || "";
  const adaPilihanKelas = new Set(S.sesiList.map((s) => s.kelas_id)).size > 1;
  render(kepala(namaKelas) + `<div class="wadah"><div class="kartu">
    ${adaPilihanKelas ? `<button class="kembali" onclick="mulai()">‹ Ganti kelas</button>` : ""}
    <p class="judul-langkah">Langkah ${adaPilihanKelas ? 2 : 1}</p><h2>Pilih yang mau dikerjakan</h2>
    <div class="daftar">${list.map((s) => `<button class="pilihan" onclick="pilihSesi('${s.id}')">
      <span class="ikon">${s.mode === "ujian" ? "📝" : "🎯"}</span>
      <span class="isi"><b>${esc(s.bank?.judul || "Soal")}</b><small>${esc(s.bank?.mapel?.nama_mapel || "")}${s.bank?.bab ? " · Bab " + s.bank.bab : ""}${s.durasi_menit ? " · " + s.durasi_menit + " menit" : ""}</small></span>
      <span class="lencana ${s.mode === "ujian" ? "l-ujian" : "l-latihan"}">${s.mode === "ujian" ? "UJIAN" : "LATIHAN"}</span></button>`).join("")}</div>
  </div></div>`);
}

// ── Langkah 3: pilih nama ──
async function pilihSesi(sesiId) {
  S.sesi = S.sesiList.find((s) => s.id === sesiId);
  render(kepala(S.sesi.bank?.judul) + `<div class="wadah"><div class="kartu"><div class="memuat">Memuat daftar nama…</div></div></div>`);
  try {
    const [sis, st] = await Promise.all([
      supa.from("siswa").select("id,nama,nis").eq("kelas_id", S.sesi.kelas_id).eq("status_aktif", true).then(({ data, error }) => { if (error) throw error; return data || []; }),
      rpc("ujian_status_kelas", { p_sesi: sesiId }),
    ]);
    S.siswa = sis.sort((a, b) => (parseInt(a.nis, 10) || 1e9) - (parseInt(b.nis, 10) || 1e9) || a.nama.localeCompare(b.nama, "id"));
    S.status = st || {};
  } catch (e) {
    render(kepala() + `<div class="wadah"><div class="kartu kosong"><div class="besar">⚠️</div>${esc(pesanGalat(e))}<br><br><button class="tombol" onclick="pilihSesi('${sesiId}')">Coba lagi</button></div></div>`);
    return;
  }
  render(kepala(S.sesi.bank?.judul) + `<div class="wadah"><div class="kartu">
    <button class="kembali" onclick="pilihKelas('${S.kelasId}')">‹ Kembali</button>
    <p class="judul-langkah">Pilih namamu</p><h2>Siapa namamu?</h2>
    <input class="cari" id="cari" placeholder="🔍 Ketik namamu…" oninput="saringNama()">
    <div class="daftar" id="daftar-nama"></div>
  </div></div>`);
  saringNama();
}
function saringNama() {
  const k = ($("cari")?.value || "").toLowerCase().trim();
  const lab = { mengerjakan: ["l-proses", "Sedang dikerjakan"], dikirim: ["l-selesai", "Terkirim ✓"], dinilai: ["l-selesai", "Selesai ✓"] };
  const html = S.siswa.filter((s) => !k || s.nama.toLowerCase().includes(k)).map((s) => {
    const st = lab[S.status[s.id]];
    return `<button class="pilihan" onclick="konfirmasiNama('${s.id}')"><span class="ikon">👤</span><span class="isi"><b>${esc(s.nama)}</b>${s.nis ? `<small>NIS ${esc(s.nis)}</small>` : ""}</span>${st ? `<span class="lencana ${st[0]}">${st[1]}</span>` : ""}</button>`;
  }).join("");
  $("daftar-nama").innerHTML = html || `<div class="kosong">Nama tidak ditemukan.</div>`;
}
function konfirmasiNama(id) {
  S.murid = S.siswa.find((s) => s.id === id);
  const ujian = S.sesi.mode === "ujian";
  dialog(`<h3>Benar ini kamu?</h3>
    <p><b style="font-size:17px">${esc(S.murid.nama)}</b><br>${ujian ? "Ini <b>UJIAN</b>: jawaban hanya bisa dikirim satu kali. Jangan pakai nama temanmu." : "Ini <b>latihan</b>: boleh diulang untuk memperbaiki nilai."}${S.sesi.durasi_menit ? `<br>Waktu: <b>${S.sesi.durasi_menit} menit</b>, dihitung sejak mulai.` : ""}</p>
    <div class="navi"><button class="tombol garis" onclick="tutupDialog()">Bukan</button><button class="tombol" onclick="masuk()">Ya, mulai</button></div>`);
}

// ── Langkah 4: masuk (cek token, lanjutkan draf) ──
async function masuk(ulang) {
  const tokenEl = $("isi-token");
  if (tokenEl) S.token = tokenEl.value.trim();
  dialog(`<div class="memuat">Menyiapkan soal…</div>`);
  let r;
  try {
    r = await rpc("ujian_mulai", { p_sesi: S.sesi.id, p_siswa: S.murid.id, p_token: S.token || null, p_ulang: !!ulang });
  } catch (e) {
    const m = pesanGalat(e);
    if (/Token salah/i.test(m)) {
      dialog(`<h3>🔑 Masukkan token</h3><p>Token ditulis ustadz di papan atau layar kelas.</p>
        <input class="token" id="isi-token" maxlength="8" autocomplete="off" value="${esc(S.token)}">
        <div class="galat">${S.token ? "Token salah, coba lagi." : ""}</div>
        <div class="navi"><button class="tombol garis" onclick="tutupDialog()">Batal</button><button class="tombol" onclick="masuk(${!!ulang})">Masuk</button></div>`);
      setTimeout(() => $("isi-token")?.focus(), 50);
      return;
    }
    dialog(`<h3>Tidak bisa mulai</h3><p>${esc(m)}</p><div class="navi"><button class="tombol" onclick="tutupDialog()">Tutup</button></div>`);
    return;
  }
  if (r.status !== "mengerjakan") { tutupDialog(); tampilHasil(r); return; }
  try {
    const { data, error } = await supa.from("ujian_bank").select("soal,judul").eq("id", S.sesi.bank_id).single();
    if (error) throw error;
    siapkanSoal(data.soal);
  } catch (e) {
    dialog(`<h3>Soal gagal dimuat</h3><p>${esc(pesanGalat(e))}</p><div class="navi"><button class="tombol" onclick="masuk()">Coba lagi</button></div>`);
    return;
  }
  tutupDialog();
  // jawaban tersimpan: server dulu, cadangan lokal kalau lebih baru (mis. internet sempat putus)
  const lokal = bacaLokal();
  S.jawab = normalJawab(r.jawaban);
  if (lokal && hitungTerjawab(lokal) > hitungTerjawab(S.jawab)) S.jawab = normalJawab(lokal);
  S.sisa = r.sisa_detik == null ? null : Number(r.sisa_detik);
  S.pindahTab = 0; S.terkirim = false; S.idx = 0;
  if (S.sisa !== null && S.sisa <= 0) { kirim(true); return; }
  tampilSoal();
  mulaiTimer();
}
function normalJawab(j) { j = j || {}; return { pg: j.pg || {}, pgk: j.pgk || {}, uraian: j.uraian || {} }; }
function kunciLokal() { return "ujianDraf:" + S.sesi.id + ":" + S.murid.id; }
function bacaLokal() { try { return JSON.parse(localStorage.getItem(kunciLokal()) || "null"); } catch (e) { return null; } }
function simpanLokal() { try { localStorage.setItem(kunciLokal(), JSON.stringify(S.jawab)); } catch (e) {} }
function hapusLokal() { try { localStorage.removeItem(kunciLokal()); } catch (e) {} }
function hitungTerjawab(j) {
  j = normalJawab(j);
  return Object.keys(j.pg).length + Object.values(j.pgk).filter((v) => v && v.length).length + Object.values(j.uraian).filter((v) => String(v || "").trim()).length;
}

// Ratakan bagian → daftar soal. Acak urutan (per santri, tetap sama walau dibuka ulang) kalau guru memilih.
function siapkanSoal(bagian) {
  const out = [];
  (bagian || []).forEach((b) => {
    let soal = (b.soal || []).map((s) => ({ ...s, jenis: b.jenis, judulBagian: b.judul, stimulusBagian: b.stimulus || null }));
    if (S.sesi.acak && b.jenis !== "uraian") {
      let seed = [...(S.murid.id + b.jenis)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
      const acak = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
      for (let i = soal.length - 1; i > 0; i--) { const j = Math.floor(acak() * (i + 1)); [soal[i], soal[j]] = [soal[j], soal[i]]; }
    }
    out.push(...soal);
  });
  S.soal = out;
}
const LABEL = { pg: "Pilihan Ganda", pgk: "Pilihan Ganda Kompleks", uraian: "Uraian" };
function sudahDijawab(s) {
  if (s.jenis === "pg") return S.jawab.pg[s.no] !== undefined;
  if (s.jenis === "pgk") return (S.jawab.pgk[s.no] || []).length > 0;
  return String(S.jawab.uraian[s.no] || "").trim() !== "";
}

function tampilSoal() {
  const s = S.soal[S.idx];
  if (!s) return;
  const total = S.soal.length, n = S.idx + 1;
  const stimulus = s.stimulus || s.stimulusBagian;
  let isi = "";
  if (s.jenis === "pg" || s.jenis === "pgk") {
    const pilih = s.jenis === "pg" ? [S.jawab.pg[s.no]] : (S.jawab.pgk[s.no] || []);
    isi = `${s.jenis === "pgk" ? `<p class="petunjuk">Pilih <b>lebih dari satu</b> jawaban yang benar.</p>` : ""}
      <div class="${s.jenis}">${(s.o || []).map((o, i) => `<button class="opsi ${pilih.includes(i) ? "dipilih" : ""}" onclick="pilihOpsi(${i})"><span class="huruf">${HURUF[i].toUpperCase()}</span><span>${fmt(o)}</span></button>`).join("")}</div>`;
  } else {
    isi = `<textarea id="uraian" placeholder="Tulis jawabanmu di sini…" oninput="ketikUraian(this.value)">${esc(S.jawab.uraian[s.no] || "")}</textarea>`;
  }
  const stimJudul = typeof stimulus === "object" && stimulus ? stimulus.judul : "";
  const stimTeks = typeof stimulus === "object" && stimulus ? stimulus.teks : stimulus;
  render(`<div class="bilah">
      <div class="nm"><b>${esc(S.murid.nama)}</b>${esc(S.sesi.bank?.judul || "")} · <span class="simpan-info" id="simpan-info">tersimpan</span></div>
      ${S.sisa !== null ? `<span class="waktu" id="waktu">--:--</span>` : ""}
      <button class="tombol" style="padding:8px 12px;font-size:13px;background:var(--emas);color:#1d2a26" onclick="tanyaKirim()">Kirim</button>
    </div>
    <div class="wadah" style="margin-top:14px"><div class="kartu">
      <div class="no-soal">${LABEL[s.jenis]} · Soal ${n} dari ${total}</div>
      ${stimTeks ? `<div class="stimulus">${stimJudul ? `<div class="jdl">${esc(stimJudul)}</div>` : ""}${fmt(stimTeks)}</div>` : ""}
      <div class="teks-soal">${fmt(s.t)}</div>
      ${isi}
      <div class="navi" style="margin-top:14px">
        <button class="tombol garis" onclick="geser(-1)" ${S.idx === 0 ? "disabled" : ""}>‹ Sebelumnya</button>
        ${S.idx < total - 1 ? `<button class="tombol" onclick="geser(1)">Berikutnya ›</button>` : `<button class="tombol" style="background:var(--emas);color:#1d2a26" onclick="tanyaKirim()">Selesai & kirim</button>`}
      </div>
    </div>
    <div class="kartu"><div style="font-weight:700;font-size:14px">Nomor soal <span style="color:var(--abu);font-weight:500">(${hitungTerjawab(S.jawab)}/${total} terjawab)</span></div>
      ${["pg", "pgk", "uraian"].filter((j) => S.soal.some((x) => x.jenis === j)).map((j) => `<div class="grup-label">${LABEL[j]}</div><div class="grid-no">${S.soal.map((x, i) => x.jenis !== j ? "" : `<button class="${sudahDijawab(x) ? "terjawab" : ""} ${i === S.idx ? "aktif" : ""}" onclick="lompat(${i})">${S.soal.filter((y, k) => y.jenis === j && k <= i).length}</button>`).join("")}</div>`).join("")}
    </div></div>`);
  perbaruiWaktu();
}
function geser(d) { S.idx = Math.max(0, Math.min(S.soal.length - 1, S.idx + d)); tampilSoal(); }
function lompat(i) { S.idx = i; tampilSoal(); }
function pilihOpsi(i) {
  const s = S.soal[S.idx];
  if (s.jenis === "pg") S.jawab.pg[s.no] = i;
  else {
    const a = new Set(S.jawab.pgk[s.no] || []);
    a.has(i) ? a.delete(i) : a.add(i);
    S.jawab.pgk[s.no] = [...a].sort((x, y) => x - y);
    if (!S.jawab.pgk[s.no].length) delete S.jawab.pgk[s.no];
  }
  berubah(); tampilSoal();
}
function ketikUraian(v) {
  const s = S.soal[S.idx];
  if (String(v).trim()) S.jawab.uraian[s.no] = v; else delete S.jawab.uraian[s.no];
  berubah();
}
// Simpan ke HP seketika, ke server 3 detik setelah berhenti mengubah (hemat kuota).
function berubah() {
  simpanLokal();
  const el = $("simpan-info"); if (el) el.textContent = "menyimpan…";
  clearTimeout(S.simpanT);
  S.simpanT = setTimeout(simpanServer, 3000);
}
async function simpanServer() {
  if (S.terkirim) return;
  try {
    await rpc("ujian_simpan_draf", { p_sesi: S.sesi.id, p_siswa: S.murid.id, p_jawaban: S.jawab, p_pindah_tab: S.pindahTab });
    const el = $("simpan-info"); if (el) el.textContent = "tersimpan";
  } catch (e) {
    const el = $("simpan-info"); if (el) el.textContent = "tersimpan di HP (offline)";
  }
}

function mulaiTimer() {
  clearInterval(S.timer);
  if (S.sisa === null) return;
  const akhir = Date.now() + S.sisa * 1000;
  S.timer = setInterval(() => {
    S.sisa = Math.max(0, Math.round((akhir - Date.now()) / 1000));
    perbaruiWaktu();
    if (S.sisa <= 0) { clearInterval(S.timer); kirim(true); }
  }, 1000);
}
function perbaruiWaktu() {
  const el = $("waktu"); if (!el || S.sisa === null) return;
  const m = Math.floor(S.sisa / 60), d = S.sisa % 60;
  el.textContent = `${String(m).padStart(2, "0")}:${String(d).padStart(2, "0")}`;
  el.classList.toggle("kritis", S.sisa <= 60);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && S.murid && !S.terkirim && S.soal.length && S.sesi?.mode === "ujian") { S.pindahTab++; simpanServer(); }
});
window.addEventListener("beforeunload", (e) => { if (S.soal.length && !S.terkirim) { e.preventDefault(); e.returnValue = ""; } });

function tanyaKirim() {
  const kosong = S.soal.filter((s) => !sudahDijawab(s)).length;
  dialog(`<h3>Kirim jawaban?</h3>
    <p>${kosong ? `Masih ada <b>${kosong} soal</b> belum dijawab.<br>` : "Semua soal sudah dijawab. "}${S.sesi.mode === "ujian" ? "Setelah dikirim, jawaban <b>tidak bisa diubah</b>." : "Nilai latihan langsung keluar."}</p>
    <div class="navi"><button class="tombol garis" onclick="tutupDialog()">Periksa lagi</button><button class="tombol" onclick="kirim()">Kirim</button></div>`);
}
async function kirim(otomatis) {
  if (S.terkirim) return;
  clearTimeout(S.simpanT);
  dialog(`<div class="memuat">${otomatis ? "Waktu habis — jawaban dikirim otomatis…" : "Mengirim jawaban…"}</div>`);
  try {
    const r = await rpc("ujian_kirim", { p_sesi: S.sesi.id, p_siswa: S.murid.id, p_jawaban: S.jawab, p_pindah_tab: S.pindahTab });
    S.terkirim = true; clearInterval(S.timer); hapusLokal(); tutupDialog();
    S.soal = [];
    tampilHasil(r);
  } catch (e) {
    dialog(`<h3>Gagal mengirim</h3><p>${esc(pesanGalat(e))}<br>Jawabanmu aman tersimpan di HP ini. Coba kirim lagi.</p>
      <div class="navi"><button class="tombol" onclick="kirim(${!!otomatis})">Kirim ulang</button></div>`);
  }
}

// Hasil: hanya nilai akhir (tanpa kunci, tanpa benar/salah per soal).
function tampilHasil(r) {
  const latihan = (r.mode || S.sesi.mode) === "latihan";
  let isi;
  if (r.nilai_akhir !== null && r.nilai_akhir !== undefined) {
    const n = Number(r.nilai_akhir);
    const pesan = n >= 90 ? "Masya Allah, luar biasa! 🌟" : n >= 75 ? "Barakallahu fiik, bagus! 👍" : n >= 60 ? "Lumayan, terus belajar ya 💪" : "Jangan menyerah, pelajari lagi bab ini 📖";
    isi = `<div style="font-size:15px;color:var(--abu)">${latihan ? "Nilai latihanmu" : "Nilai akhirmu"}</div><div class="angka">${Math.round(n)}</div>
      <div style="font-weight:700;margin-bottom:8px">${pesan}</div>
      ${latihan && r.nilai_terbaik != null ? `<div class="ket">Nilai terbaikmu: <b>${Math.round(r.nilai_terbaik)}</b>${r.percobaan ? ` · percobaan ke-${r.percobaan}` : ""}</div>` : ""}
      ${latihan ? `<div class="ket">Soal uraian tidak dinilai di latihan.</div>` : ""}`;
  } else if (r.status === "mengerjakan") {
    isi = `<div style="font-size:40px">⏳</div><div class="ket">Kamu belum selesai mengerjakan.</div>`;
  } else {
    isi = `<div style="font-size:46px">✅</div><h2 style="margin:6px 0">Jawaban terkirim</h2>
      <div class="ket">Nilai akhir keluar setelah ustadz menilai soal uraian.<br>Cek lagi nanti: buka halaman ini, pilih ujian yang sama, lalu pilih namamu.</div>`;
  }
  render(kepala(S.sesi.bank?.judul) + `<div class="wadah"><div class="kartu hasil">
    <div style="font-weight:700;font-size:16px;margin-bottom:10px">${esc(S.murid.nama)}</div>${isi}
    <div class="navi" style="margin-top:22px;flex-wrap:wrap">
      ${latihan && S.sesiList.find((s) => s.id === S.sesi.id) ? `<button class="tombol" onclick="masuk(true)">↻ Ulangi latihan</button>` : ""}
      <button class="tombol garis" onclick="selesai()">Selesai</button>
    </div></div></div>`);
}
function selesai() { S.murid = null; S.soal = []; S.token = ""; pilihSesi(S.sesi.id); }

mulai();
</script>
</body>
</html>
