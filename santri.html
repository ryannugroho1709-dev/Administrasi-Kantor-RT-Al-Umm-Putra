<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Ruang Santri · PKBM Al-Umm Barabai</title>
<meta name="theme-color" content="#0b4a3c"/>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2"></script>
<script src="src/config.js?v=4"></script>
<script src="src/santri-game.js?v=3" defer></script>
<style>
  :root{--hijau:#0b4a3c;--hijau2:#13715b;--hijau3:#1f9c7c;--emas:#d4a72c;--latar:#eef4f1;--kartu:#fff;--teks:#1d2a26;--abu:#6b7c76;--garis:#dfe7e3;--merah:#d64545;--biru:#2563eb;--ungu:#7c3aed;--oranye:#ea7a1a;--pilih:#e3f3ec;
    --c-pg:#2563eb;--c-pgk:#7c3aed;--c-uraian:#ea7a1a;--c-isian:#0d9488;--c-jodoh:#db2777;--c-urut:#4f46e5}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--teks);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--latar);background-image:radial-gradient(circle at 10% 0%,rgba(31,156,124,.10),transparent 40%),radial-gradient(circle at 100% 30%,rgba(212,167,44,.10),transparent 35%);min-height:100vh}
  button{font:inherit;cursor:pointer;color:inherit}
  @keyframes naik{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes jatuh{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.9}}
  .anim{animation:naik .35s ease both}
  .atas{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b4a3c,#13715b 60%,#1f9c7c);color:#fff;padding:22px 16px 56px;text-align:center}
  .atas::before,.atas::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
  .atas::before{width:220px;height:220px;right:-60px;top:-90px}.atas::after{width:140px;height:140px;left:-40px;bottom:-70px}
  .atas h1{margin:0;font-size:22px;font-weight:800;position:relative}
  .atas p{margin:5px 0 0;font-size:13px;opacity:.88;position:relative}
  .wadah{max-width:760px;margin:-36px auto 40px;padding:0 14px;position:relative}
  .kartu{background:var(--kartu);border-radius:20px;box-shadow:0 10px 30px rgba(11,74,60,.10);padding:18px;margin-bottom:14px;animation:naik .35s ease both}
  .judul-langkah{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--hijau2);background:rgba(19,113,91,.1);padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}
  h2{font-size:19px;margin:0 0 14px}
  .daftar{display:grid;gap:10px}
  .pilihan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--garis);border-radius:16px;padding:12px 14px;transition:transform .15s,border-color .15s,box-shadow .15s}
  .pilihan:hover{border-color:var(--hijau3);box-shadow:0 6px 16px rgba(19,113,91,.12);transform:translateY(-1px)}
  .badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
  .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:none}
  .pilihan .isi{flex:1;min-width:0}
  .pilihan b{display:block;font-size:15px}
  .pilihan small{color:var(--abu);font-size:12.5px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:#f1f5f3;color:#44514c;margin:4px 4px 0 0}
  .lencana{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
  .l-ujian{background:#fdecea;color:var(--merah)} .l-latihan{background:#e6effe;color:var(--biru)} .l-selesai{background:#e3f3ec;color:var(--hijau2)} .l-proses{background:#fff4d6;color:#8a6500} .l-susulan{background:#f3e8ff;color:var(--ungu)} .l-remedial{background:#ffedd5;color:#c2410c}
  .cari{width:100%;padding:13px 14px;border:1.5px solid var(--garis);border-radius:14px;font:inherit;margin-bottom:12px;background:#fbfdfc}
  .cari:focus{outline:none;border-color:var(--hijau3)}
  .tombol{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--hijau2),var(--hijau3));color:#fff;box-shadow:0 6px 16px rgba(19,113,91,.25);transition:transform .12s}
  .tombol:active{transform:scale(.97)}
  .tombol.garis{background:#fff;color:var(--hijau);border:1.5px solid var(--hijau2);box-shadow:none}
  .tombol.emas{background:linear-gradient(135deg,#e2b53a,#c99613);color:#2b2205;box-shadow:0 6px 16px rgba(201,150,19,.3)}
  .tombol.lebar{width:100%}
  .tombol:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .kembali{background:none;border:0;color:var(--hijau2);font-weight:800;padding:0;margin-bottom:12px}
  .kosong{text-align:center;color:var(--abu);padding:26px 8px;font-size:14px;line-height:1.6}
  .kosong .besar{font-size:44px;margin-bottom:6px}
  .memuat{text-align:center;padding:30px;color:var(--abu)}
  .memuat::before{content:"";display:block;width:34px;height:34px;margin:0 auto 10px;border-radius:50%;border:4px solid var(--garis);border-top-color:var(--hijau3);animation:putar 0.8s linear infinite}
  @keyframes putar{to{transform:rotate(360deg)}}
  /* ── layar ujian ── */
  .bilah{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0b4a3c,#13715b);color:#fff;padding:10px 14px 0;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .bilah-isi{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
  .bilah .nm{flex:1;min-width:0;font-size:12px;line-height:1.3;opacity:.95}
  .bilah .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .waktu{font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.16);padding:7px 11px;border-radius:12px;font-size:15px}
  .waktu.kritis{background:var(--merah);animation:pop 1s infinite}
  .progres{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin:10px auto 0;max-width:760px;overflow:hidden}
  .progres i{display:block;height:100%;background:linear-gradient(90deg,#f6d365,#fda085);border-radius:99px;transition:width .3s}
  .progres-teks{max-width:760px;margin:4px auto 0;font-size:11px;opacity:.85;padding-bottom:8px;display:flex;justify-content:space-between}
  .kartu-soal{border-top:5px solid var(--warna,var(--c-pg))}
  .kepala-soal{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .no-bulat{width:40px;height:40px;border-radius:12px;background:var(--warna);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .jenis-soal{font-size:12px;font-weight:800;color:var(--warna);text-transform:uppercase;letter-spacing:.5px}
  .sub-soal{font-size:11.5px;color:var(--abu)}
  .ragu-btn{margin-left:auto;border:1.5px solid #f0d58a;background:#fffaf0;color:#8a6500;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800}
  .ragu-btn.aktif{background:#f6c344;border-color:#f6c344;color:#3d2c00}
  .stimulus{background:linear-gradient(180deg,#fbf7ea,#f7f2e1);border:1px solid #efe3bd;border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.75;margin-bottom:14px;white-space:pre-wrap}
  .stimulus .lbl{font-size:11.5px;font-weight:800;color:#8a6500;margin-bottom:6px;display:block;white-space:normal}
  .teks-soal{font-size:16.5px;line-height:1.65;margin-bottom:14px;white-space:pre-wrap;font-weight:500}
  .teks-soal:dir(rtl),.stimulus:dir(rtl),.opsi span:dir(rtl),.bs-teks:dir(rtl),textarea:dir(rtl){font-family:'Amiri','Traditional Arabic','Plus Jakarta Sans',serif;font-size:1.3em;line-height:1.95}
  [dir=rtl] .opsi,.opsi[dir=rtl]{text-align:right}
  .kartu-soal.arab .opsi .huruf{font-family:'Amiri',serif;font-size:16px}
  .gambar-soal{display:block;max-width:100%;max-height:340px;margin:0 auto 14px;border-radius:14px;border:1px solid var(--garis);cursor:zoom-in;background:#f6f8f7}
  .opsi{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--garis);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.5;transition:border-color .15s,background .15s,transform .12s}
  .opsi:hover{border-color:color-mix(in srgb,var(--warna) 45%,#fff)}
  .opsi .huruf{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--garis);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--abu);background:#fff}
  .opsi.dipilih{border-color:var(--warna);background:color-mix(in srgb,var(--warna) 9%,#fff);animation:pop .25s ease}
  .opsi.dipilih .huruf{background:var(--warna);border-color:var(--warna);color:#fff}
  .pgk .opsi .huruf{border-radius:8px}
  textarea{width:100%;min-height:170px;border:2px solid var(--garis);border-radius:14px;padding:13px;font:inherit;font-size:15.5px;line-height:1.6;resize:vertical;background:#fcfdfc}
  textarea:focus{outline:none;border-color:var(--warna)}
  .hitung-kata{text-align:right;font-size:11.5px;color:var(--abu);margin-top:4px}
  .bs-daftar{display:grid;gap:10px}
  .bs-baris{border:2px solid var(--garis);border-radius:14px;padding:11px 12px;background:#fff}
  .bs-teks{font-size:15px;line-height:1.55;display:flex;gap:10px;margin-bottom:9px}
  .bs-no{flex:none;width:24px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--warna) 14%,#fff);color:var(--warna);display:grid;place-items:center;font-weight:800;font-size:12px}
  .bs-pilih{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bs-pilih button{border:2px solid var(--garis);background:#fff;border-radius:12px;padding:9px 6px;font-weight:800;font-size:13.5px;color:#44514c;transition:transform .12s}
  .bs-pilih button.ya{background:#dcf5ea;border-color:#13715b;color:#0b4a3c;animation:pop .25s ease}
  .bs-pilih button.tidak{background:#fde2e2;border-color:#d64545;color:#8f1d1d;animation:pop .25s ease}
  .penjelasan{margin-top:10px;border-radius:14px;padding:11px 13px;background:linear-gradient(135deg,#fff8e6,#eef9f4);border:1px solid #f0dfa8;font-size:14px;line-height:1.65;white-space:normal}
  .penjelasan b:first-child{display:block;color:#8a6500;margin-bottom:4px}
  .petunjuk{font-size:12.5px;color:var(--abu);margin:-6px 0 12px;background:#f3eefe;color:#5b2bb5;padding:7px 10px;border-radius:10px;font-weight:600}
  .navi{display:flex;gap:10px}
  .navi .tombol{flex:1}
  .navi-bawah{position:sticky;bottom:0;z-index:4;background:rgba(238,244,241,.92);backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--garis)}
  .navi-bawah .navi{max-width:760px;margin:0 auto}
  .navi-bawah .grid-btn{flex:0 0 auto;padding:13px 14px}
  .grid-no{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .grid-no button{height:42px;border-radius:12px;border:2px solid var(--garis);background:#fff;font-weight:800;font-size:13px;position:relative}
  .grid-no button.terjawab{background:var(--hijau2);border-color:var(--hijau2);color:#fff}
  .grid-no button.ragu{background:#f6c344;border-color:#f6c344;color:#3d2c00}
  .grid-no button.aktif{outline:3px solid var(--biru);outline-offset:2px}
  .grup-label{font-size:12px;font-weight:800;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
  .grup-label i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--abu);margin-top:12px}
  .legenda span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  /* ── petunjuk awal ── */
  .bagian-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 16px}
  .bagian-info div{border-radius:16px;padding:12px;color:#fff;background:var(--warna);box-shadow:0 6px 14px rgba(0,0,0,.1)}
  .bagian-info b{display:block;font-size:22px}.bagian-info span{font-size:12px;opacity:.92}
  .aturan{margin:0;padding-left:20px;font-size:13.5px;line-height:1.8;color:#44514c}
  /* ── hasil ── */
  .hasil-atas{text-align:center;padding:8px 0 4px}
  .cincin{position:relative;width:170px;height:170px;margin:6px auto 4px}
  .cincin svg{transform:rotate(-90deg)}
  .cincin .angka{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:800;color:var(--hijau)}
  .cincin .angka small{display:block;font-size:12px;color:var(--abu);font-weight:600;margin-top:-6px}
  .pesan-hasil{font-weight:800;font-size:17px;margin:4px 0}
  .ket{color:var(--abu);font-size:13.5px;line-height:1.6}
  .statistik{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .statistik div{border-radius:14px;padding:10px 6px;text-align:center;background:var(--bg);border:1px solid rgba(0,0,0,.04)}
  .statistik b{display:block;font-size:20px}.statistik span{font-size:11px;color:#44514c}
  .bar-baris{margin:10px 0}
  .bar-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
  .bar{height:12px;border-radius:99px;background:#edf1ef;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width 1s ease}
  .judul-seksi{font-weight:800;font-size:15px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .judul-seksi .ikon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px}
  .soal-chip{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
  .soal-chip button{border:0;border-radius:12px;padding:8px 2px;font-weight:800;font-size:12.5px;line-height:1.2}
  .soal-chip button small{display:block;font-size:14px}
  .s-benar{background:#dcf5ea;color:#11704f}.s-sebagian{background:#fff1cc;color:#8a6500}.s-salah{background:#fde2e2;color:#b42318}.s-kosong{background:#eef0f2;color:#5b6670}.s-tidak_dinilai{background:#eef0f2;color:#8a949c}
  .detail-soal{border-radius:14px;background:#f8faf9;border:1px solid var(--garis);padding:12px;margin-top:10px;font-size:14px;line-height:1.6;white-space:pre-wrap;animation:naik .25s ease both}
  .grafik-kelas{display:flex;align-items:flex-end;gap:8px;height:130px;padding:0 4px;margin-top:6px}
  .grafik-kelas div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--abu)}
  .grafik-kelas .tiang{width:100%;border-radius:10px 10px 4px 4px;background:#cfe3db;transition:height 1s ease;min-height:4px;position:relative}
  .grafik-kelas .kamu .tiang{background:linear-gradient(180deg,#f6d365,#ea7a1a)}
  .grafik-kelas .kamu b{color:var(--oranye)}
  .serpih{position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:30;animation:jatuh 2.6s linear forwards}
  /* ── dialog ── */
  .lapis{position:fixed;inset:0;background:rgba(10,30,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
  .lapis.buka{display:flex}
  .dialog{background:#fff;border-radius:22px;max-width:460px;width:100%;padding:20px;max-height:88vh;overflow:auto;animation:naik .25s ease both}
  .dialog h3{margin:0 0 8px}
  .dialog p{margin:0 0 16px;color:#44514c;line-height:1.6;font-size:14.5px}
  .lapis.gambar{cursor:zoom-out}.lapis.gambar img{max-width:100%;max-height:92vh;border-radius:12px;background:#fff}
  input.token{width:100%;padding:14px;font-size:24px;text-align:center;letter-spacing:8px;text-transform:uppercase;border:2px solid var(--garis);border-radius:14px;font-weight:800;margin-bottom:14px}
  .galat{color:var(--merah);font-size:13px;margin-top:-6px;margin-bottom:10px;min-height:1em}
  .catatan-kaki{text-align:center;font-size:12px;color:var(--abu);margin-top:10px;line-height:1.7}
  @media (max-width:420px){.teks-soal{font-size:15.5px}.statistik b{font-size:17px}.cincin{width:150px;height:150px}}
  /* ── jenis soal baru ── */
  .audio-soal{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #ddd6fe;border-radius:14px;padding:10px 12px;margin:0 0 14px}
  .audio-soal span{font-size:12px;font-weight:800;color:#5b21b6;white-space:nowrap}.audio-soal audio{flex:1;min-width:0;height:40px}
  .isian-kotak{display:inline-block;min-width:120px;max-width:100%;border:0;border-bottom:2.5px solid var(--warna);background:color-mix(in srgb,var(--warna) 7%,#fff);border-radius:8px 8px 2px 2px;padding:6px 10px;font:inherit;font-size:16px;font-weight:700;color:var(--hijau);margin:2px 4px;vertical-align:baseline}
  .isian-kotak:focus{outline:none;background:color-mix(in srgb,var(--warna) 14%,#fff)}
  .isian-satu{display:block;width:100%;margin:0;font-size:17px;padding:12px 14px;border:2px solid var(--garis);border-radius:14px}
  .isian-satu:focus{border-color:var(--warna)}
  .jodoh-kanan{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:14px}
  .jodoh-kanan div{border:2px dashed color-mix(in srgb,var(--warna) 40%,#fff);border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.45;background:color-mix(in srgb,var(--warna) 4%,#fff)}
  .jodoh-kanan b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--warna);color:#fff;font-size:12px;margin-right:6px}
  .jodoh-kanan div.terpakai{opacity:.55}
  .jodoh-baris{border:2px solid var(--garis);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .jodoh-baris.terisi{border-color:var(--warna);background:color-mix(in srgb,var(--warna) 5%,#fff)}
  .jodoh-kiri{font-size:15px;line-height:1.5;margin-bottom:8px;display:flex;gap:8px}
  .jodoh-huruf{display:flex;flex-wrap:wrap;gap:6px}
  .jodoh-huruf button{min-width:40px;height:38px;border-radius:11px;border:2px solid var(--garis);background:#fff;font-weight:800;font-size:14px;color:#44514c}
  .jodoh-huruf button.pakai{border-style:dashed;opacity:.6}
  .jodoh-huruf button.on{background:var(--warna);border-color:var(--warna);color:#fff;opacity:1;animation:pop .25s ease}
  .urut-hasil{min-height:58px;border:2px dashed var(--warna);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--warna) 5%,#fff);margin-bottom:10px}
  .urut-hasil:empty::before{content:"Ketuk bagian di bawah sesuai urutan yang benar…";color:var(--abu);font-size:13px;padding:8px}
  .urut-pilih{display:flex;flex-wrap:wrap;gap:8px}
  .urut-chip{border:2px solid var(--garis);background:#fff;border-radius:12px;padding:9px 12px;font-size:15px;line-height:1.35;font-weight:600;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .12s}
  .urut-chip:active{transform:scale(.95)}
  .urut-hasil .urut-chip{border-color:var(--warna);background:#fff;display:flex;gap:6px;align-items:center}

<script>
// =====================================================================
//  RUANG SANTRI — latihan & ujian per bab (tanpa login; santri pilih namanya)
//  Kunci jawaban tidak pernah dikirim SAAT mengerjakan: penilaian dilakukan di server
//  (RPC ujian_kirim). Setelah dikirim, rincian hasil (ujian_hasil_rinci) memuat kunci

const supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const HURUF = "ABCDEFGHIJ";
const HURUF_AR = ["أ", "ب", "ج", "د", "هـ", "و", "ز", "ح", "ط", "ي"];
// Soal berbahasa Arab (huruf Arab lebih banyak dari huruf Latin) → ditampilkan kanan-ke-kiri
const soalArab = (s) => { const t = [s.t, ...(s.o || [])].join(" "); return (t.match(/[؀-ۿ]/g) || []).length > (t.match(/[A-Za-z]/g) || []).length; };
const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b><u>$1</u></b>"); // **kata** = dicetak tebal di soal asli
const JENIS = ["pg", "pgk", "isian", "jodoh", "urut", "uraian"];
const WARNA = { pg: "var(--c-pg)", pgk: "var(--c-pgk)", isian: "var(--c-isian)", jodoh: "var(--c-jodoh)", urut: "var(--c-urut)", uraian: "var(--c-uraian)" };
const HEX = { pg: "#2563eb", pgk: "#7c3aed", isian: "#0d9488", jodoh: "#db2777", urut: "#4f46e5", uraian: "#ea7a1a" };
const LABEL = { pg: "Pilihan Ganda", pgk: "Pilihan Ganda Kompleks", isian: "Isian Singkat", jodoh: "Menjodohkan", urut: "Mengurutkan", uraian: "Uraian" };
const S = { sesiList: [], kelasId: null, sesi: null, siswa: [], status: {}, murid: null, token: "", soal: [], bagian: [], idx: 0, jawab: { pg: {}, pgk: {}, isian: {}, jodoh: {}, urut: {}, uraian: {} }, ragu: new Set(), sisa: null, timer: null, simpanT: null, pindahTab: 0, terkirim: false };
const ujianBerjalan = () => S.sesi?.mode === "ujian" && S.murid && !S.terkirim && S.soal.length > 0;

  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Internet terputus. Periksa koneksi lalu coba lagi.";
  if (/function .* does not exist|ujian_/i.test(m) && /does not exist|schema cache/i.test(m)) return "Fitur ujian belum diaktifkan oleh admin (SQL belum dijalankan).";
  return m;
}
function render(html) { $("akar").innerHTML = html; window.scrollTo(0, 0); try { kbTampil(); } catch (e) {} }

function dialog(html) { $("dialog").innerHTML = html; $("lapis").classList.add("buka"); }

function rpc(nama, arg) { return supa.rpc(nama, arg).then(({ data, error }) => { if (error) throw error; return data; }); }
function warnaNama(nama) { let h = 0; for (const c of String(nama)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 45%)`; }

function gambarHTML(url) { return url ? `<img class="gambar-soal" src="${esc(url)}" alt="Gambar soal" loading="lazy" onclick="perbesar(this.src)">` : ""; }

// ── Langkah 1: pilih kelas ──
async function ambilSesi() {
  const kolom = "id,mode,durasi_menit,acak,kelas_id,bank_id,created_at,dibuka,kelas:kelas(nama_kelas),bank:ujian_bank(judul,bab,tingkat,mapel:mapel(nama_mapel))";
  // sesi dibuka + sesi tertutup yang punya peserta susulan / hasilnya sudah dibuka guru
  let r = await supa.from("ujian_sesi").select(kolom + ",susulan,tampil_hasil,remedial").or("dibuka.eq.true,susulan.neq.{},tampil_hasil.eq.true,remedial.eq.true").order("created_at", { ascending: false }).limit(40);
  if (r.error && /remedial/.test(r.error.message || "")) r = await supa.from("ujian_sesi").select(kolom + ",susulan,tampil_hasil").or("dibuka.eq.true,susulan.neq.{},tampil_hasil.eq.true").order("created_at", { ascending: false }).limit(40);
  if (r.error && /susulan|tampil_hasil/.test(r.error.message || "")) r = await supa.from("ujian_sesi").select(kolom).eq("dibuka", true).order("created_at", { ascending: false });
  if (r.error) throw r.error;
  return r.data || [];
}

async function masuk(ulang) {

        <input class="token" id="isi-token" maxlength="8" autocomplete="off" value="${esc(S.token)}">

      setTimeout(() => $("isi-token")?.focus(), 50);
      return;
    }
    if (/ditutup/i.test(m)) { dialog(`<h3>⏹ Sesi sudah ditutup</h3><p>Ustadz sudah menutup ujian ini. Kalau kamu kemarin izin atau sakit, minta ustadz membukakan <b>ujian susulan</b> untuk namamu.</p><div class="navi"><button class="tombol" onclick="tutupDialog()">Mengerti</button></div>`); return; }
    dialog(`<h3>Tidak bisa mulai</h3><p>${esc(m)}</p><div class="navi"><button class="tombol" onclick="tutupDialog()">Tutup</button></div>`);
    return;
  }
  if (r.status !== "mengerjakan") { tutupDialog(); tampilHasil(r); return; }
  try { S.gaya = (await gameMuatGaya())[S.sesi.id] || null; S.gayaSelesai = false; await muatBank(); }
  catch (e) {
    dialog(`<h3>Soal gagal dimuat</h3><p>${esc(pesanGalat(e))}</p><div class="navi"><button class="tombol" onclick="masuk()">Coba lagi</button></div>`);
    return;
  }
  tutupDialog();
  // jawaban tersimpan: server dulu, cadangan lokal kalau lebih banyak (mis. internet sempat putus)
  const lokal = bacaLokal();
  S.jawab = normalJawab(r.jawaban);
  if (lokal && hitungTerjawab(lokal) > hitungTerjawab(S.jawab)) S.jawab = normalJawab(lokal);
  S.ragu = new Set(bacaRagu());
  S.sisa = r.sisa_detik == null ? null : Number(r.sisa_detik);
  S.pindahTab = 0; S.terkirim = false; S.idx = 0;
  if (S.sisa !== null && S.sisa <= 0) { kirim(true); return; }
  if (hitungTerjawab(S.jawab) === 0) { tampilPetunjuk(r); return; }
  mulaiKerja();
}

function normalJawab(j) { j = j || {}; return { pg: j.pg || {}, pgk: j.pgk || {}, isian: j.isian || {}, jodoh: j.jodoh || {}, urut: j.urut || {}, uraian: j.uraian || {} }; }

function hitungTerjawab(j) {

// Generator acak yang tetap sama untuk santri & benih yang sama (urutan tidak berubah walau dibuka ulang).
function acakDengan(benih) {
  let seed = [...benih].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  return () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
}
// Ratakan bagian → daftar soal. Kalau guru memilih acak: urutan soal & urutan pilihan diacak per santri.
// Pilihan yang diacak tetap disimpan dengan nomor ASLINYA, jadi penilaian di server tidak terpengaruh.
function siapkanSoal(bagian) {
  const out = [];

    let soal = (b.soal || []).map((s) => ({ ...s, jenis: b.jenis, stimulusBagian: b.stimulus || null, urutanOpsi: (s.o || []).map((_, i) => i) }));
    if (S.sesi.acak && b.jenis !== "uraian") {
      const acak = acakDengan(S.murid.id + b.jenis);
      for (let i = soal.length - 1; i > 0; i--) { const j = Math.floor(acak() * (i + 1)); [soal[i], soal[j]] = [soal[j], soal[i]]; }
      if (b.jenis === "pg" || b.jenis === "pgk") soal.forEach((s) => {
        const a2 = acakDengan(S.murid.id + b.jenis + s.no), u = s.urutanOpsi;
        for (let i = u.length - 1; i > 0; i--) { const j = Math.floor(a2() * (i + 1)); [u[i], u[j]] = [u[j], u[i]]; }
      });
    }
    out.push(...soal);

  S.soal = out;
}

function geser(d) { S.idx = Math.max(0, Math.min(S.soal.length - 1, S.idx + d)); tampilSoal(); }

function tambahUrut(x) { const s = S.soal[S.idx], a = (S.jawab.urut[s.no] || []).slice(); if (!a.includes(x)) a.push(x); S.jawab.urut[s.no] = a; berubah(); tampilSoal(); }

// ── Jawaban rekaman suara (ujian speaking / membaca / hafalan) ──
// Rekaman diunggah ke penyimpanan sekolah; yang disimpan sebagai jawaban hanya tautannya: "[rekaman] https://…"
const REKAM = { rec: null, potongan: [], mulai: 0, t: null, sibuk: false, maks: 180 };
const urlRekaman = (v) => { const m = String(v || "").match(/^\[rekaman\]\s*((?:https?:\/\/|blob:)\S+)/); return m ? m[1] : null; };
function rekamHTML(s) {
  const url = urlRekaman(S.jawab.uraian[s.no]);
  if (REKAM.rec) return `<div class="rekam"><button class="tombol-rekam aktif" onclick="rekamBerhenti()">⏹</button><div class="waktu-rekam" id="waktu-rekam">00:00</div><div class="ket">Sedang merekam… tekan ⏹ bila selesai (maks ${REKAM.maks / 60} menit)</div></div>`;
  if (REKAM.sibuk) return `<div class="rekam"><div class="memuat">Mengunggah rekaman…</div></div>`;
  return `<div class="rekam">${url ? `<div class="ket" style="font-weight:800;color:var(--hijau2)">✅ Rekamanmu tersimpan</div><audio controls src="${esc(url)}"></audio><div class="ket" style="margin-top:10px">Belum puas? Rekam ulang:</div>` : `<div class="ket" style="margin-bottom:10px">Jawab soal ini dengan <b>suaramu</b>. Tekan tombol merah untuk mulai merekam.</div>`}
    <button class="tombol-rekam" onclick="rekamMulai()">🎤</button><div class="ket" style="margin-top:8px">Izinkan mikrofon bila diminta</div></div>`;
}
async function rekamMulai() {
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") { dialog(`<h3>Perekam tidak tersedia</h3><p>HP/peramban ini belum bisa merekam suara. Coba buka di Google Chrome terbaru.</p><div class="navi"><button class="tombol" onclick="tutupDialog()">Tutup</button></div>`); return; }
  try {
    REKAM.abaikan = true; // jendela izin mikrofon jangan dihitung "pindah layar"
    const aliran = await navigator.mediaDevices.getUserMedia({ audio: true }).finally(() => setTimeout(() => { REKAM.abaikan = false; }, 1500));
    const tipe = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find((t) => MediaRecorder.isTypeSupported?.(t)) || "";
    REKAM.rec = new MediaRecorder(aliran, tipe ? { mimeType: tipe, audioBitsPerSecond: 48000 } : undefined);
    REKAM.potongan = []; REKAM.mulai = Date.now(); REKAM.soal = S.soal[S.idx];
    REKAM.rec.ondataavailable = (e) => { if (e.data && e.data.size) REKAM.potongan.push(e.data); };
    REKAM.rec.onstop = () => { aliran.getTracks().forEach((t) => t.stop()); rekamUnggah(); };
    REKAM.rec.start(1000);
    REKAM.t = setInterval(() => { const d = Math.round((Date.now() - REKAM.mulai) / 1000), el = $("waktu-rekam"); if (el) el.textContent = `${String(Math.floor(d / 60)).padStart(2, "0")}:${String(d % 60).padStart(2, "0")}`; if (d >= REKAM.maks) rekamBerhenti(); }, 500);
    tampilSoal();
  } catch (e) { dialog(`<h3>Mikrofon tidak bisa dipakai</h3><p>${esc(e.message || e)}. Pastikan izin mikrofon untuk halaman ini diaktifkan.</p><div class="navi"><button class="tombol" onclick="tutupDialog()">Tutup</button></div>`); }
}
function rekamBerhenti() { clearInterval(REKAM.t); if (REKAM.rec && REKAM.rec.state !== "inactive") REKAM.rec.stop(); }
async function rekamUnggah() {
  const s = REKAM.soal, tipe = REKAM.rec?.mimeType || "audio/webm";
  REKAM.rec = null; REKAM.sibuk = true; tampilSoal();
  const blob = new Blob(REKAM.potongan, { type: tipe.split(";")[0] });
  const ext = /mp4/.test(tipe) ? "m4a" : /ogg/.test(tipe) ? "ogg" : "webm";
  if (S.coba) { S.jawab.uraian[s.no] = "[rekaman] " + URL.createObjectURL(blob); berubah(); REKAM.sibuk = false; tampilSoal(); return; }
  try {
    const path = `ujian-jawab/${S.sesi.id}/${S.murid.id}-${s.jenis}${s.no}-${Date.now()}.${ext}`;
    const { error } = await supa.storage.from("foto").upload(path, blob, { contentType: blob.type, upsert: true });
    if (error) throw error;
    S.jawab.uraian[s.no] = "[rekaman] " + supa.storage.from("foto").getPublicUrl(path).data.publicUrl;
    berubah();
  } catch (e) { dialog(`<h3>Rekaman gagal diunggah</h3><p>${esc(pesanGalat(e))}<br>Periksa internet lalu rekam ulang.</p><div class="navi"><button class="tombol" onclick="tutupDialog()">Mengerti</button></div>`); }
  REKAM.sibuk = false; tampilSoal();
}
// Simpan ke HP seketika, ke server 3 detik setelah berhenti mengubah (hemat kuota).

function mulaiTimer() {

// ── Hasil: nilai + rincian per soal + KUNCI JAWABAN & pembahasan (latihan langsung; ujian setelah dibuka guru) ──
function cincin(n) {
  const r = 70, k = 2 * Math.PI * r;
  const [w1, w2] = n >= 80 ? ["#34d399", "#22d3ee"] : n >= 60 ? ["#fbbf24", "#f97316"] : ["#fb7185", "#f43f5e"];
  return `<div class="cincin h4-cincin"><svg width="100%" height="100%" viewBox="0 0 170 170"><defs><linearGradient id="gr-cincin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${w1}"/><stop offset="1" stop-color="${w2}"/></linearGradient>
      <filter id="pendar"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="12"/>
    <circle cx="85" cy="85" r="${r - 15}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1" stroke-dasharray="2 5"/>
    <circle id="busur" cx="85" cy="85" r="${r}" fill="none" stroke="url(#gr-cincin)" stroke-width="12" stroke-linecap="round" filter="url(#pendar)" stroke-dasharray="${k}" stroke-dashoffset="${k}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)" data-akhir="${k * (1 - Math.max(0, Math.min(100, n)) / 100)}"/></svg>
    <div class="angka"><div><span id="angka-nilai" data-n="${Math.round(n)}">0</span><small>dari 100</small></div></div></div>`;
}
function serpihan() {
  for (let i = 0; i < 26; i++) {
    const e = document.createElement("div"); e.className = "serpih";
    e.textContent = ["🌟", "✨", "🎉", "⭐", "💚"][i % 5];
    e.style.left = Math.random() * 100 + "vw"; e.style.animationDelay = Math.random() * 0.8 + "s";
    document.body.appendChild(e); setTimeout(() => e.remove(), 3600);
  }
}
const predikat = (n) => n >= 90 ? ["A", "Istimewa"] : n >= 80 ? ["B", "Baik sekali"] : n >= 70 ? ["C", "Baik"] : n >= 60 ? ["D", "Cukup"] : ["E", "Perlu belajar lagi"];
async function tampilHasil(r) {
  const latihan = (r.mode || S.sesi.mode) === "latihan";

function kbAktif(s) {
  s = s || S.soal[S.idx];
  if (!s || !(s.jenis === "isian" || (s.jenis === "uraian" && !s.rek))) return false;
  const k = kunciKB(s);
  return KB.nyala.has(k) || (soalArab(s) && !KB.mati.has(k));
}
// tombol saklar di bawah kotak jawaban
function kbSaklarHTML(s) {
  const on = kbAktif(s);
  return `<div class="kb-saklar ${on ? "on" : ""}"><button type="button" onclick="kbSaklar()"><span class="kb-lampu"></span>⌨️ Keyboard Arab <b>${on ? "AKTIF" : "MATI"}</b></button>
    <small>${on ? "Ketik dengan tombol di bawah, atau keyboard HP/laptop — otomatis jadi huruf Arab" : "Nyalakan bila ingin menjawab dengan huruf Arab"}</small></div>`;
}
function kbSaklar() {
  const s = S.soal[S.idx], k = kunciKB(s), on = kbAktif(s);
  if (on) { KB.nyala.delete(k); KB.mati.add(k); } else { KB.mati.delete(k); KB.nyala.add(k); }
  tampilSoal();
  setTimeout(() => { const el = document.querySelector(".isian-kotak, #uraian"); if (el) { el.focus(); kbTampil(); } }, 30);
}
function kbTampil() {
  const p = $("kb-ar"); if (!p) return;
  const buka = kbAktif() && KB.target && document.body.contains(KB.target);
  if (buka) {
    p.innerHTML = `<div class="kb-isi" dir="rtl">
      ${KB.harakat ? `<div class="kb-baris">${HARAKAT.map(([h, nm]) => `<button type="button" class="kb-t hrk" data-h="${h}">ـ${h}<small>${nm}</small></button>`).join("")}</div>`
        : BARIS_AR.map((baris) => `<div class="kb-baris">${baris.map((h) => `<button type="button" class="kb-t" data-h="${h}">${h}</button>`).join("")}</div>`).join("")}
      <div class="kb-baris bawah" dir="ltr">
        <button type="button" class="kb-t fn" data-f="tutup" title="Matikan keyboard Arab">ABC</button>
        <button type="button" class="kb-t fn" data-f="mundur" title="Soal sebelumnya" ${S.idx === 0 ? "disabled" : ""}>‹</button>
        <button type="button" class="kb-t fn ${KB.harakat ? "on" : ""}" data-f="harakat">${KB.harakat ? "ا ب ت" : "◌َ ◌ِ ◌ُ"}</button>
        <button type="button" class="kb-t spasi" data-h=" ">spasi</button>
        ${KB.target && KB.target.tagName === "TEXTAREA" ? `<button type="button" class="kb-t fn" data-h="\n">↵</button>` : ""}
        <button type="button" class="kb-t fn hapus" data-f="hapus">⌫</button>
        <button type="button" class="kb-t fn" data-f="maju" title="Soal berikutnya">${S.idx < S.soal.length - 1 ? "›" : "✓"}</button>
      </div></div>`;
  }
  p.classList.toggle("buka", !!buka);
  document.body.classList.toggle("kb-terbuka", !!buka);
}
function kbSisip(el, teks) {
  if (!el) return;
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? el.value.length;
  el.setRangeText(teks, a, b, "end");
  el.dispatchEvent(new Event("input", { bubbles: true }));
}
function kbHapus(el) {
  if (!el) return;
  let a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? el.value.length;
  if (a === b) { if (!a) return; a = a - 1; if (/[\uDC00-\uDFFF]/.test(el.value[a]) && a > 0) a--; }
  el.setRangeText("", a, b, "end");
  el.dispatchEvent(new Event("input", { bubbles: true }));
}
(function pasangKB() {
  const panel = document.createElement("div"); panel.id = "kb-ar"; panel.className = "kb-ar";
  document.body.appendChild(panel);
  // pointerdown + preventDefault: kotak jawaban tetap fokus (keyboard HP tidak muncul-hilang)
  panel.addEventListener("pointerdown", (e) => {
    const t = e.target.closest(".kb-t"); if (!t) return;
    e.preventDefault();
    const el = KB.target;
    if (t.dataset.f === "tutup") { kbSaklar(); return; }
    if (t.dataset.f === "harakat") { KB.harakat = !KB.harakat; kbTampil(); return; }
    if (t.dataset.f === "hapus") { kbHapus(el); return; }
    const fokusLagi = () => setTimeout(() => { const x = document.querySelector(".isian-kotak, #uraian"); if (x && kbAktif()) { x.focus(); KB.target = x; kbTampil(); } }, 30);
    if (t.dataset.f === "mundur") { if (S.idx > 0) { geser(-1); fokusLagi(); } return; }
    if (t.dataset.f === "maju") { if (S.idx < S.soal.length - 1) { geser(1); fokusLagi(); } else tanyaKirim(); return; }
    kbSisip(el, t.dataset.h);
    t.classList.remove("ditekan"); void t.offsetWidth; t.classList.add("ditekan");
    if (KB.harakat) { KB.harakat = false; kbTampil(); }
  });
  const kotak = (el) => el && el.matches && el.matches("input.isian-kotak, textarea#uraian");
  document.addEventListener("focusin", (e) => { if (kotak(e.target)) { KB.target = e.target; kbTampil(); } });
  // keyboard fisik (laptop / keyboard bluetooth / HP yang mengirim kode tombol)
  document.addEventListener("keydown", (e) => {
    if (!kotak(e.target) || !kbAktif() || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    const h = PETA_AR_SHIFT[e.key] || PETA_AR[e.key] || PETA_AR[String(e.key).toLowerCase()];
    if (!h || e.key.length !== 1) return;
    e.preventDefault(); kbSisip(e.target, h);
  }, true);
  // cadangan untuk keyboard HP yang tidak mengirim kode tombol: huruf latin yang masuk langsung diubah
  document.addEventListener("input", (e) => {
    if (!kotak(e.target) || !kbAktif() || e.isComposing || !/[A-Za-z]/.test(e.target.value)) return;
    const el = e.target, pos = el.selectionStart ?? el.value.length;
    const ubah = (t) => t.replace(/[A-Za-z]/g, (c) => PETA_AR[c.toLowerCase()] || c);
    const depan = ubah(el.value.slice(0, pos)), blk = ubah(el.value.slice(pos));
    el.value = depan + blk; el.setSelectionRange(depan.length, depan.length);
  }, true);
})();

// ── MODE UJI COBA (guru/admin) — santri.html?coba=… ──
// Soal & kunci dititipkan aplikasi guru di penyimpanan perangkat ini. Tidak ada yang dikirim/ditulis ke server:
// mulai, simpan draf, kirim, dan penilaian semuanya dikerjakan di perangkat (rumus sama dengan server).
function mulaiUjiCoba() {
  const id = new URLSearchParams(location.search).get("coba");
  let d = null;
  try { d = JSON.parse(localStorage.getItem("ujiCoba:" + id) || "null"); } catch (e) {}
  if (!d) {
    render(kepala("Uji coba soal", "🧪 Uji coba") + `<div class="wadah"><div class="kartu kosong"><div class="besar">🧪</div>Data uji coba tidak ditemukan di perangkat ini.<br>Buka dari aplikasi guru: <b>Ujian Online → 🧪 Uji coba</b> pada bank soal.<br><br><a class="tombol" href="./" style="text-decoration:none;display:inline-block">‹ Ke aplikasi guru</a></div></div>`);
    return;
  }
  document.body.classList.add("mode-coba");
  S.coba = d; S.gaya = null; S.gayaSelesai = true;
  S.sesi = { id: "coba-" + id, mode: "coba", acak: false, durasi_menit: null, dibuka: true, kelas_id: null, kelas: { nama_kelas: d.tingkat ? "Kelas " + d.tingkat : "" }, bank: { judul: d.judul, mapel: { nama_mapel: d.mapel || "" } } };
  S.murid = { id: "guru", nama: d.guru || "Guru (uji coba)" };
  S.bagian = d.soal || [];
  siapkanSoal(S.bagian);
  S.jawab = normalJawab({}); S.ragu = new Set(); S.idx = 0; S.sisa = null; S.terkirim = false; S.pindahTab = 0; S.rinci = null;
  hapusLokal();
  tampilPetunjuk({});
}
const bulat2 = (x) => Math.round(x * 100) / 100;
// Saran skor uraian dari kata kunci "poin penilaian" (sama seperti saran di layar guru)
function saranUraianCoba(jw, ks, poin) {
  const t = String(jw || "").toLowerCase();
  if (!t.trim()) return 0;
  if (urlRekaman(jw)) return null;
  const pk = ks.poin_kunci || [];
  if (!pk.length) return null;
  const kena = pk.filter((p) => String(p).toLowerCase().split(/[^a-z0-9à-ÿ؀-ۿ-]+/i).filter((w) => w.length >= 4).some((w) => t.includes(w))).length;
  return Math.round((poin * kena) / pk.length);
}
function nilaiCoba() {
  const K = S.coba.kunci || { bagian: [] }, J = S.jawab;
  let skor = 0, maks = 0, adaPerkiraan = false;
  const soal = [], bagian = [];
  (K.bagian || []).forEach((b) => {
    const jen = b.jenis; let bd = 0, bm = 0;
    (b.soal || []).forEach((s) => {
      const poin = Number(s.poin ?? b.poin ?? 1), jw = (J[jen] || {})[s.no], k = s.k;
      let d = 0, terjawab;
      if (jen === "uraian") {
        terjawab = String(jw || "").trim() !== "";
        d = saranUraianCoba(jw, s, poin);
        if (d != null && terjawab) adaPerkiraan = true;
      } else {
        terjawab = jen === "pg" ? typeof jw === "number" : adaIsi(jw ?? null);
        if (jen === "pg") { if (typeof jw === "number" && [].concat(k).includes(jw)) d = poin; }
        else if (jen === "isian") {
          const kk = Array.isArray(k) ? k : [];
          const cocok = kk.filter((alt, i) => { const v = (jw || [])[i]; return typeof v === "string" && normal(v) !== "" && [].concat(alt).some((a) => normal(a) === normal(v)); }).length;
          d = bulat2((poin * cocok) / Math.max(kk.length, 1));
        } else if (jen === "jodoh" || jen === "urut") {
          const kk = Array.isArray(k) ? k : [];
          const cocok = kk.filter((x, i) => typeof (jw || [])[i] === "number" && jw[i] === x).length;
          d = bulat2((poin * cocok) / Math.max(kk.length, 1));
        } else if (Array.isArray(k) && typeof k[0] === "boolean") {
          const cocok = k.filter((x, i) => typeof (jw || [])[i] === "boolean" && jw[i] === x).length;
          d = bulat2((poin * cocok) / Math.max(k.length, 1));
        } else if (Array.isArray(jw)) {
          const kk = [].concat(k ?? []), u = [...new Set(jw)];
          const benar = u.filter((x) => kk.includes(x)).length, salah = u.length - benar;
          d = bulat2((poin * Math.max(0, benar - salah)) / Math.max(kk.length, 1));
        }
      }
      const st = d == null ? "tidak_dinilai" : !terjawab ? "kosong" : d >= poin ? "benar" : d > 0 ? "sebagian" : "salah";
      if (d != null) { skor += d; maks += poin; bd += d; bm += poin; }
      soal.push({ jenis: jen, no: s.no, status: st, dapat: d, maks: poin, penjelasan: (s.penjelasan || "").trim() || null,
        kunci: jen === "uraian" ? { teks: s.kunci || "", poin: s.poin_kunci || [] } : k });
    });
    bagian.push({ jenis: jen, dapat: bd, maks: bm });
  });
  return { status: "dinilai", mode: "coba", boleh: true, ada_kunci: true, nilai_akhir: maks ? Math.round((skor * 100) / maks) : 0,
    bagian, soal, jawaban: JSON.parse(JSON.stringify(J)), kelas: { n: 0 }, perkiraan: adaPerkiraan };
}
// Catatan khusus guru: soal yang kuncinya patut dicek & saran tingkat kesulitan
function catatanCobaHTML(r) {

      ${tanpaKunci.length ? `<li style="color:#b42318">⚠️ Belum ada kunci: ${tanpaKunci.map((x) => `${LABEL[x.jenis]} ${esc(x.no)}`).join(", ")} — soal ini akan selalu dinilai salah.</li>` : ""}
      ${uraianTanpaPoin.length ? `<li>Uraian tanpa "poin penilaian" (no. ${uraianTanpaPoin.map((x) => esc(x.no)).join(", ")}) tidak bisa diperkirakan otomatis — di ujian asli Anda menilainya sendiri.</li>` : ""}
      ${r.perkiraan ? `<li>Skor uraian di sini hanya <b>perkiraan</b> dari kata kunci poin penilaian.</li>` : ""}
      <li>Tingkat kesulitan: coba minta 1–2 guru lain ikut uji coba. Setelah ujian asli, buka <b>Rekap → 🔬 Analisis soal</b>: soal yang dijawab benar &lt; 40% santri = terlalu sulit / kunci perlu dicek, &gt; 90% = terlalu mudah.</li>
    </ul></div>`;
}
function selesai() { if (S.coba) { mulaiUjiCoba(); return; } S.murid = null; S.soal = []; S.token = ""; S.rinci = null; pilihSesi(S.sesi.id); }
